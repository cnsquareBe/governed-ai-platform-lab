[project]
name = "governed-ai-lab"
version = "0.1.0"
description = "Governed AI Action Platform - hands-on lab"
authors = [
    { name = "christiannyabeyengatchou", email = "nyabeye@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[project.scripts]
ops-server = "governed_ai_lab.ops_server:main"
agent = "governed_ai_lab.agent:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
